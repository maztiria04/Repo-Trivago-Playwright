name: Trivago Scrape

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * *"   # todos los días 09:00 UTC (ajustable)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          TRIVAGO_URL: ${{ secrets.TRIVAGO_URL }}
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          MAX_ITEMS: "30"
        run: npm start
